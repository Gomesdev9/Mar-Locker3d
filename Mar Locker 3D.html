<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mar Locker 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: palco 3D em tela cheia; barra de título fina no topo; dock de controles flutuando embaixo;
   ficha da peça no canto superior esquerdo; lista de peças em gaveta à direita. */
:root {
  --bg: #e7eef3;
  --surface: #ffffff;
  --surface-2: #f1f5f8;
  --fg: #13223b;
  --muted: #5a6b80;
  --line: rgba(19, 34, 59, 0.13);
  --accent: #1d4f91;
  --accent-ink: #ffffff;
  --sea: #2f8fcc;
  --stage-a: #f4f8fb;
  --stage-b: #d9e3ea;
  --shadow: 0 8px 28px rgba(19, 34, 59, 0.14);
  --font-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1624; --surface: #13223a; --surface-2: #1a2c47; --fg: #e6eef7; --muted: #94a7be;
    --line: rgba(230, 238, 247, 0.13); --accent: #6cb4ec; --accent-ink: #0c1624; --sea: #6cb4ec;
    --stage-a: #1a2b44; --stage-b: #0b1522; --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1624; --surface: #13223a; --surface-2: #1a2c47; --fg: #e6eef7; --muted: #94a7be;
  --line: rgba(230, 238, 247, 0.13); --accent: #6cb4ec; --accent-ink: #0c1624; --sea: #6cb4ec;
  --stage-a: #1a2b44; --stage-b: #0b1522; --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.01em; }
.brand h1 span { color: var(--sea); }
.dims { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats { font-size: 0.85rem; color: var(--muted); }

.stage {
  position: relative; flex: 1; min-height: 0; overflow: hidden;
  background: linear-gradient(180deg, var(--stage-a) 0%, var(--stage-a) 35%, var(--stage-b) 100%);
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.stage.is-hover canvas { cursor: pointer; }

.card {
  position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px));
  width: min(300px, calc(100% - 28px)); background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 6px;
}
.card .eyebrow { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
.card dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.86rem; }
.card dt { color: var(--muted); }
.card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid var(--line); }
.linkbtn { justify-self: start; background: none; border: 0; padding: 2px 0; color: var(--sea); cursor: pointer; font-size: 0.86rem; font-weight: 600; }

.dock {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100% - 28px);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px;
  padding: 8px 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow);
}
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.slider { display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); }
.slider input { width: 120px; accent-color: var(--sea); }
.views { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.chip {
  border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 8px;
  cursor: pointer; font-size: 0.84rem; font-weight: 600;
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { border-color: var(--sea); color: var(--sea); }
.sep { width: 1px; align-self: stretch; background: var(--line); }

.tag {
  position: absolute; pointer-events: none; transform: translate(12px, -130%);
  background: var(--fg); color: var(--bg); font-size: 0.8rem; font-weight: 600; padding: 4px 8px; border-radius: 6px;
  white-space: nowrap;
}

.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 88%);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(105%); transition: transform 0.28s ease; display: flex; flex-direction: column;
  padding-right: env(safe-area-inset-right, 0px);
}
.drawer.open { transform: none; }
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font-family: var(--font-display); font-size: 1rem; font-weight: 600; }
.drawer ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; display: grid; align-content: start; gap: 2px; }
.drawer li button {
  width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 8px;
}
.drawer li button:hover, .drawer li button[aria-pressed="true"] { background: var(--surface-2); }
.drawer li .nm { font-weight: 600; font-size: 0.9rem; }
.drawer li .qt { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.drawer li .sz { grid-column: 2 / 4; font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); }
.close { border: 0; background: var(--surface-2); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 0.84rem; }

.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

@media (max-width: 640px) {
  .dock { gap: 6px 8px; padding: 6px 8px; }
  .slider input { width: 90px; }
  .sep { display: none; }
  .card { padding: 10px 12px; }
  .card p.hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>

<header class="top">
  <div class="brand">
    <h1>Mar <span>Locker</span></h1>
    <span class="dims" id="dims">protótipo</span>
  </div>
  <span class="stats" id="stats"></span>
</header>

<main class="stage" id="stage">
  <canvas id="c" aria-label="Modelo 3D do Mar Locker. Arraste para girar, use a roda ou pinça para aproximar."></canvas>

  <section class="card" id="card" aria-live="polite">
    <span class="eyebrow" id="cardEyebrow">Como usar</span>
    <h2 id="cardTitle">Montado</h2>
    <p class="hint" id="cardHint">Arraste para girar e use a roda (ou pinça) para aproximar. Toque numa peça para ver o nome, o arquivo e a medida.</p>
    <dl id="cardInfo" hidden>
      <dt>Arquivo</dt><dd class="mono" id="iFile"></dd>
      <dt>Impressão</dt><dd class="mono" id="iSize"></dd>
      <dt>Cor</dt><dd id="iColor"></dd>
      <dt>Qtd.</dt><dd class="mono" id="iQty"></dd>
    </dl>
    <p id="iNote" hidden></p>
    <button class="linkbtn" id="clearSel" type="button" hidden>Limpar seleção</button>
  </section>

  <div class="tag" id="tag" hidden></div>

  <nav class="dock" aria-label="Controles do modelo">
    <div class="seg" role="group" aria-label="Estado da montagem">
      <button type="button" id="bMont" aria-pressed="true">Montado</button>
      <button type="button" id="bExp" aria-pressed="false">Explodido</button>
    </div>
    <label class="slider" for="sep">Separação <input type="range" id="sep" min="0" max="100" value="0"></label>
    <span class="sep" aria-hidden="true"></span>
    <div class="views" role="group" aria-label="Ângulo da câmera">
      <button type="button" class="chip" data-view="iso">3/4</button>
      <button type="button" class="chip" data-view="front">Frente</button>
      <button type="button" class="chip" data-view="back">Trás</button>
      <button type="button" class="chip" data-view="side">Lado</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="chip" id="bSpin" aria-pressed="false">Girar</button>
    <button type="button" class="chip" id="bList" aria-expanded="false" aria-controls="drawer">Peças</button>
  </nav>

  <aside class="drawer" id="drawer" aria-label="Lista de peças" inert>
    <header>
      <h2 id="listTitle">Peças</h2>
      <button type="button" class="close" id="bClose">Fechar</button>
    </header>
    <ul id="list"></ul>
  </aside>
</main>

      $("iSize").textContent = pd.size;
      $("iColor").innerHTML = "";
      const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = pd.swatch;
      $("iColor").append(sw, document.createTextNode(pd.color));
      $("iQty").textContent = pd.qty > 1 ? pd.qty + " iguais" : "1";
      $("iNote").textContent = pd.note; $("iNote").hidden = !pd.note;
    } else {
      $("cardEyebrow").textContent = "Como usar";
      $("cardTitle").textContent = t >= 0.5 ? "Explodido" : "Montado";
      $("iNote").hidden = true;
    }
    document.querySelectorAll("#list button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.group === group)));
    paint();
  }
  $("clearSel").addEventListener("click", () => showPart(null));

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(ev) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(root.children, true)[0];
    return hit ? MODEL.parts[hit.object.userData.idx] : null;
  }
  let down = null;
  canvas.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener("pointerup", (e) => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; return; }
    down = null;
    const pd = pick(e);
    showPart(pd ? (pd.group === selected ? null : pd.group) : null);
  });
  const tag = $("tag");
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse" || e.buttons) { return; }
    const pd = pick(e);
    const g = pd ? pd.group : null;
    if (g !== hovered) { hovered = g; paint(); }
    stage.classList.toggle("is-hover", !!pd);
    tag.hidden = !pd;
    if (pd) {
      const r = stage.getBoundingClientRect();
      tag.textContent = pd.label;
      tag.style.left = (e.clientX - r.left) + "px"; tag.style.top = (e.clientY - r.top) + "px";
    }
  });
  canvas.addEventListener("pointerleave", () => { hovered = null; tag.hidden = true; stage.classList.remove("is-hover"); paint(); });

  // ---------- lista de peças
  const seen = new Set(); const list = $("list");
  MODEL.parts.forEach((pd) => {
    if (seen.has(pd.group)) return; seen.add(pd.group);
    const li = document.createElement("li"); const b = document.createElement("button");
    b.type = "button"; b.dataset.group = pd.group; b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<span class="sw"></span><span class="nm"></span><span class="qt"></span><span class="sz"></span>';
    b.querySelector(".sw").style.background = pd.swatch;
    b.querySelector(".nm").textContent = pd.label;
    b.querySelector(".qt").textContent = "×" + pd.qty;
    b.querySelector(".sz").textContent = pd.size;
    b.addEventListener("click", () => showPart(selected === pd.group ? null : pd.group));
    li.appendChild(b); list.appendChild(li);
  });
  $("listTitle").textContent = "Peças (" + seen.size + " tipos)";
  const drawer = $("drawer");
  function setDrawer(open) {
    drawer.classList.toggle("open", open); drawer.inert = !open;
    $("bList").setAttribute("aria-expanded", String(open));
  }
  $("bList").addEventListener("click", () => setDrawer(!drawer.classList.contains("open")));
  $("bClose").addEventListener("click", () => setDrawer(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setDrawer(false); });

  // ---------- tamanho e loop
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); needsRender = true;
    if (currentView && !camTween) goView(currentView, true);
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  applyExplode();
  goView("iso", true);

  function loop(now) {
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / tween.dur);
      t = tween.from + (tween.to - tween.from) * ease(k);
      applyExplode();
      if (!camTween && !controls.autoRotate) {
        controls.target.lerp(targetFor(), 0.12);
      }
      if (k >= 1) { tween = null; if (currentView) goView(currentView); }
    }
    if (camTween) {
      const k = Math.min(1, (now - camTween.t0) / camTween.dur), e = ease(k), f = camTween.from, to = camTween.to;
      const s = new THREE.Spherical(f.radius + (to.radius - f.radius) * e, f.phi + (to.phi - f.phi) * e, f.theta + camTween.dTheta * e);
      controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
      camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
      if (k >= 1) camTween = null;
      needsRender = true;
    }
    if (controls.update() || controls.autoRotate) needsRender = true;
    if (needsRender) { renderer.render(scene, camera); needsRender = false; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
